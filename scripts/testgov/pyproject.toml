[project]
name = "testgov"
version = "0.2.0"
description = "ADR-0001 test-contract governor: proves matrix rows against the tree"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# The free-threaded build is what makes the parallel walk actually parallel: on a GIL build
# the same code runs, just serialized. `uv run --python 3.15t` selects it.
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["test_*.py"]
