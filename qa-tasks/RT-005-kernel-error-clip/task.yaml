id: RT-005-kernel-error-clip
title: A 1.5MB kernel error payload is clipped to the settle cap in the transcript
origin: "verify-unbounded #11 (uncapped ename/evalue/traceback); fix 58394f09a"
difficulty: medium
lane:
  - faux
network: "off"
budget:
  # the clipped error is ~65536 chars (~16k tokens) + system prompt; the
  # uncapped bug this task guards would be ~1.5MB (~375k tokens)
  tokens: 60000
  steps: 5
  timeout_s: 120
bin_args:
  - --offline
setup: setup.sh
prompt: |-
  Run the prepared Python cell (it raises a huge error) and then tell me the error was handled.
oracle:
  type: state
  spec:
    - transcript_not_contains: ""
    - transcript_contains: "[... output truncated at"
reference: reference/solution.md
