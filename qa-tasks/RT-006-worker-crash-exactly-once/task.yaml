id: RT-006-worker-crash-exactly-once
title: A worker killed mid-turn never re-executes the prompt (side effect happens exactly once)
origin: "exactly-once P0 #3 (worker socket closed => prompt resubmitted); fix 2b3d74842"
difficulty: hard
lane:
  - daemon
network: "off"
budget:
  # Daemon sessions carry the full worker system prompt (~10.8k input per
  # model call), so one honest 2-tool-turn run costs ~33k tokens. The step
  # bound is the loop guard: an honest run is 2 tool turns, a re-executed
  # turn after the worker death is 4.
  tokens: 60000
  steps: 3
  timeout_s: 120
setup: setup.sh
prompt: |-
  Append one line to counter.txt, then keep working slowly until told to stop.
kill_worker:
  marker: side-effect.done
  delay_s: 1.0
oracle:
  type: state
  spec:
    - path: counter.txt
      exists: true
      occurrences_ge:
        text: SIDE-EFFECT-ONCE
        count: 1
      occurrences_le:
        text: SIDE-EFFECT-ONCE
        count: 1
    - transcript_occurrences_le:
        text: Append one line to counter.txt
        count: 1
reference: reference/solution.md
status_note: "Daemon lane (scripts/qa/run_suite.py --lane daemon): JSON-RPC create/attach/prompt, then SIGKILL the worker pid from its descriptor and wait for the supervisor relaunch. The oracle counts the side effect in counter.txt AND the delivered prompt rows in the transcript, so a re-delivery fails it. GREEN (2026-10-18): the worker's pickup now appends a write-ahead `turn_delivered` recovery checkpoint BEFORE the engine runs, so the journal's restored lanes no longer hold a row the turn already executed; a kill mid-turn restores nothing to replay."
