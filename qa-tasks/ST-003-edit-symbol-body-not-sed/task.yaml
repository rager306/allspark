id: ST-003-edit-symbol-body-not-sed
title: Replace one symbol body while its twin stays byte-identical
origin: "semantic tool-choice class: sed rewrites both bodies because they are textually identical"
difficulty: medium
lane:
  - faux
  - real-model
network: "off"
budget:
  tokens: 50000
  steps: 10
  timeout_s: 240
setup: setup.sh
prompt: |-
  In `src/lib.rs`, change `Config::describe` so it returns
  `describe: retries=<n> timeout=<m>` (note the `describe: ` prefix and the spaces).

  `Config::summary` must remain byte-identical - it currently has the exact same
  body, so a textual replace would corrupt both.

  Finish by printing EDIT-DONE.
oracle:
  type: script
  spec: oracle.py
must:
  - tool: lsp
    args_regex: "replace_symbol_body|find_symbol"
must_not:
  # Constrain the BEHAVIOR, not the shell spelling (review #17). These two rules used to name
  # `bash` only, so a full-file rewrite through `edit` or an lsp `insert` bypassed the gate even
  # though it violates the intent — replacing the whole file is exactly what corrupts the twin.
  # The oracle below still catches the OUTCOME (verified: a textual replace of both bodies fails
  # with "the original body must survive exactly once"), so this is defence in depth, not the
  # only check.
  - tool: bash
    args_regex: "sed -i|perl -pi|awk .*-i"
  - tool: edit
    args_regex: "old_string.{0,80}pub fn summary"
  - tool: lsp
    args_regex: "insert|replace_range|apply_workspace_edit"
reference: reference/solution.md
