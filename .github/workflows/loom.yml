# The memory-model lane (matrix row MUT-loom-spinlock).
#
# WHAT IT ADDS OVER SHUTTLE. `shuttle.yml` schedules threads deterministically,
# but it runs them on the HOST's atomics, so on x86 it inherits x86's store
# ordering and an acquire/release bug is invisible. loom models the orderings
# themselves, which is the layer this product actually depends on: we ship
# aarch64-apple-darwin, where the same bug is visible.
#
# THE ONE KNOB IS `cargo loom` (an alias in .cargo/config.toml). A cargo FEATURE
# cannot turn on `cfg(loom)`, so `crates/pa-mem/build.rs` maps the feature to the
# cfg; without that mapping the lane compiles the dependency, runs ZERO tests and
# reports green — measured on this tree before the build script existed.
#
# The oracle at the end is what keeps that from coming back: a filter that
# matched nothing must fail the lane, not pass it.
name: loom
on:
  workflow_call:

jobs:
  loom:
    name: loom (pa-mem memory model)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: loom
      - name: Run the loom model
        run: |
          set -euo pipefail
          cargo loom 2>&1 | tee loom.log
          if ! grep -qE '^test spinlock::loom_tests::' loom.log; then
            echo "::error::the loom filter ran no test; the cfg(loom) build is not active"
            exit 1
          fi
          grep -qE '^test spinlock::loom_tests::.*\.\.\. ok' loom.log || {
            echo "::error::no loom model test passed"
            exit 1
          }
