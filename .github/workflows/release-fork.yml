# Fork release pipeline (allspark tags).
#
# The upstream `release.yml` triggers on `vX.Y.Z` / `vX.Y.Z-beta*` and
# publishes the upstream channels (R2 `latest.json` / `beta.json`, the
# 4-target continuous restamp). Fork tags carry the `allspark-` prefix and
# must never enter that pipeline: their version string would fail
# `tag-check`, and the fork has no R2 channel to publish.
#
# This workflow owns the fork tags instead: build the dist-profile Linux
# binary, package it as `bin/allspark` + `libexec/prime-agent` (the layout
# `scripts/allspark-launcher.sh` expects), and attach it to a GitHub
# release whose body is the CHANGELOG-FORK.md entry for `fork.NNN`.

name: release-fork

on:
  push:
    tags:
      - "allspark-v[0-9]+.[0-9]+.[0-9]+*-fork.[0-9][0-9][0-9]"
  # Re-run/repair path: the tag names the release, so a dispatch re-publishes
  # it (the publish job is idempotent) without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "The fork tag to (re)publish, e.g. allspark-v0.10.1-beta.38-fork.009"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-fork-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORK_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  tag-check:
    name: validate the fork tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      build: ${{ steps.parse.outputs.build }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # A dispatch re-publishes an existing tag: check out that tag's tree,
          # not the default branch (the version/changelog checks run on it).
          ref: ${{ env.FORK_TAG }}
      - name: The tag names a Cargo.toml version and a fork.NNN build
        id: parse
        run: |
          set -euo pipefail
          tag="${FORK_TAG}"
          # allspark-v<version>-fork.NNN -> <version>, fork.NNN
          rest="${tag#allspark-v}"
          version="${rest%-fork.*}"
          counter="${rest##*-fork.}"
          cargo_ver="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [ "${version}" != "${cargo_ver}" ]; then
            echo "::error::tag ${tag} names version ${version}, Cargo.toml is ${cargo_ver}"
            exit 1
          fi
          if ! printf '%s' "${counter}" | grep -Eq '^[0-9]{3}$'; then
            echo "::error::the fork counter must be three digits (fork.NNN), got fork.${counter}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build=fork.${counter}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: The changelog carries this release's entry
        run: |
          set -euo pipefail
          build="${{ steps.parse.outputs.build }}"
          if ! grep -q "^## ${build} " CHANGELOG-FORK.md; then
            echo "::error::CHANGELOG-FORK.md has no '## ${build} ' entry; add it before tagging"
            exit 1
          fi

  build:
    name: build the fork payload (linux-x86_64)
    needs: tag-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # A dispatch re-publishes an existing tag: check out that tag's tree,
          # not the default branch (the version/changelog checks run on it).
          ref: ${{ env.FORK_TAG }}
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # the 1.98.1 pin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-fork
      - name: Build the dist payload
        env:
          ALLSPARK_FORK_BUILD: ${{ needs.tag-check.outputs.build }}
        run: |
          set -euo pipefail
          cargo build --locked --profile dist -p pa-cli
          built="$(./target/dist/prime-agent --version)"
          echo "built: ${built}"
          case "${built}" in
            *"fork build ${{ needs.tag-check.outputs.build }}"*) ;;
            *) echo "::error::the binary does not report the tagged fork build: ${built}"; exit 1 ;;
          esac
      - name: Generate bundled catalog assets (fixture, offline-safe)
        # Upstream release.yml parity: the no-cold-start layer 2 assets
        # (models.bundled.json + mcp-services.bundled.json) the binary
        # reads when no network is available. --fixture keeps the release
        # deterministic (no network fetch, no token); the verify run is
        # the packer gate upstream's assemble_artifacts.py enforces
        # (>= 42 transport tuples, >= 68 services) - the fork's packaging
        # is hand-rolled, so the gate lives here.
        run: |
          set -euo pipefail
          python3 scripts/release/bundle_catalog.py generate --fixture \
            --out target/catalog-assets
          python3 scripts/release/bundle_catalog.py verify --out target/catalog-assets
      - name: Package the payload
        run: |
          set -euo pipefail
          tag="${{ needs.tag-check.outputs.tag }}"
          # THE CHANNEL NAMING: the funnel's manifest check expects the archive
          # named prime-agent-<version>-<platform>.tar.gz (install-rust.sh's
          # ROW_PY), so the published archive carries the product name even
          # though the tag says allspark.
          root="prime-agent-${tag#allspark-v}-linux-x86_64"
          mkdir -p "package/${root}/bin" "package/${root}/libexec"
          cp target/dist/prime-agent "package/${root}/libexec/prime-agent"
          cp scripts/allspark-launcher.sh "package/${root}/bin/allspark"
          # The catalog assets ship beside the payload binary, not the
          # launcher: the runtime resolves them from the executable's own
          # directory (BundledAssets::package_dir), and bin/allspark is a
          # shell script - the executable the launcher execs is
          # libexec/prime-agent.
          cp target/catalog-assets/models.bundled.json \
             target/catalog-assets/mcp-services.bundled.json \
             "package/${root}/libexec/"
          # The kernel runtime and the built-in skills are NOT optional payload:
          # the bootstrap resolves them from the executable's own directory
          # (`package_dir()/prime-agent-runtime`, `package_dir()/skills`), so a
          # tarball without them installs a binary with no Python kernel and no
          # bundled skills — `--version` works, every REPL call fails. fork.009
          # shipped exactly that way. The same curated copy as the upstream
          # assembler (`copy_runtime_tree`, RUNTIME_EXCLUDED_*), because the
          # pytest suite and a dev `.venv` must not ride the payload.
          python3 - "${root}" <<'PY'
          import shutil, sys
          from pathlib import Path

          sys.path.insert(0, "scripts/release")
          from assemble_artifacts import RUNTIME_EXCLUDED_NAMES, RUNTIME_EXCLUDED_SUFFIXES

          root = Path("package") / sys.argv[1] / "libexec"
          dest = root / "prime-agent-runtime"
          source = Path("prime-agent-runtime")
          if not (source / "pyproject.toml").is_file():
              sys.exit(f"kernel runtime sidecar not found at {source}")

          def ignore(directory, names):
              return {
                  name for name in names
                  if name in RUNTIME_EXCLUDED_NAMES
                  or name.endswith(RUNTIME_EXCLUDED_SUFFIXES)
              }

          shutil.copytree(source, dest, ignore=ignore)
          shutil.copytree(Path("skills"), root / "skills")
          PY
          chmod 755 "package/${root}/bin/allspark" "package/${root}/libexec/prime-agent"
          tar -C package -czf "${root}.tar.gz" "${root}"
          sha256sum "${root}.tar.gz" > SHA256SUMS
          # THE FORK UPDATE CHANNEL (the funnel reads it): a stable pointer
          # (bare version) and the channel manifest (platform -> artifact row
          # + sha256), published as release assets. The launcher exports
          # PRIME_AGENT_DOWNLOAD_BASE_URL pointing at this release's
          # latest/download URLs, so `allspark update` fetches the fork's own
          # channel instead of refusing (no upstream channel serves fork
          # builds) or silently keeping the old payload.
          version="${tag#allspark-v}"
          mkdir -p dist
          printf '%s\n' "$version" > dist/stable
          sha_row=$(grep "${root}.tar.gz" SHA256SUMS | awk '{print $1}')
          python3 - "$version" "$sha_row" "${root}.tar.gz" <<'PY'
          import json, pathlib, sys
          version, sha, archive = sys.argv[1], sys.argv[2], sys.argv[3]
          manifest = {
              "version": version,
              "binaries": [{
                  "platform": "linux-x86_64",
                  "file": archive,
                  "sha256": sha,
              }],
          }
          pathlib.Path("dist/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          echo "channel assets: dist/stable dist/latest.json"
          cat SHA256SUMS
      - name: Prove the packaged launcher runs
        run: |
          set -euo pipefail
          # The same root the packaging step built: prime-agent-<version>-linux-x86_64,
          # version = tag minus the leading "allspark-v".
          root="prime-agent-${{ needs.tag-check.outputs.tag#allspark-v }}-linux-x86_64"
          mkdir -p unpack && tar -xzf "${root}.tar.gz" -C unpack
          ./unpack/"${root}"/bin/allspark --version
          # The offline catalog assets are part of the packaged contract:
          # a tarball that dropped them ships a release with no offline
          # catalog, so assert them on the unpacked archive.
          test -f "unpack/${root}/libexec/models.bundled.json"
          test -f "unpack/${root}/libexec/mcp-services.bundled.json"
          # A tarball without the kernel runtime installs a binary that cannot
          # run Python at all, and without `skills` it loses every built-in
          # skill; both are resolved from the executable's directory, so they
          # belong beside libexec/prime-agent. fork.009 shipped without them.
          test -f "unpack/${root}/libexec/prime-agent-runtime/pyproject.toml"
          test -d "unpack/${root}/libexec/skills"
          test -n "$(ls -A "unpack/${root}/libexec/skills")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-payload
          path: |
            *.tar.gz
            SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish the GitHub release
    needs: [tag-check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # A dispatch re-publishes an existing tag: check out that tag's tree,
          # not the default branch (the version/changelog checks run on it).
          ref: ${{ env.FORK_TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fork-payload
          path: dist
      - name: Extract the changelog entry as the release body
        env:
          BUILD: ${{ needs.tag-check.outputs.build }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          build = os.environ["BUILD"]
          text = pathlib.Path("CHANGELOG-FORK.md").read_text()
          start = text.index(f"## {build} ")
          rest = text[start:]
          nxt = re.search(r"\n## fork\.", rest[1:])
          body = rest[: nxt.start() + 1] if nxt else rest
          pathlib.Path("release-body.md").write_text(body.strip() + "\n")
          print(body[:400])
          PY
      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag-check.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists: uploading assets over it"
            gh release upload "${TAG}" dist/*.tar.gz dist/SHA256SUMS dist/stable dist/latest.json \
              --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --notes-file release-body.md
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "allspark ${TAG#allspark-v}" \
              --notes-file release-body.md \
              dist/*.tar.gz dist/SHA256SUMS dist/stable dist/latest.json
          fi
