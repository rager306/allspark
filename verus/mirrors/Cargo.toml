# A standalone Verus crate, deliberately NOT a workspace member: AGENTS.md requires
# verus/ to stay outside the cargo workspace so no build, test or `cargo fmt` reads
# it. `exclude` in the root Cargo.toml enforces that; this file exists so
# `cargo verus verify` and `cargo verus-mutants` have a package to drive.
[package]
name = "allspark-verus-mirrors"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# PINNED TO THE TOOLCHAIN, not to a date someone once used. The Verus release
# ships its own `libvstd.rlib`, and `rust_verify` recognises exactly the
# `verus_items` that release was built against: a `vstd` from a DIFFERENT
# snapshot makes `cargo verus build` abort with
# "unexpected verus diagnostic item verus::verus_builtin::ProofFnOnce" and
# `cargo verus-mutants` reports a baseline failure it cannot explain — the
# proof-depth lane was dead for a version skew, not for a proof.
#
# The toolchain here is 0.2026.11.02.8bf68ee (verus/version.json); its vstd is
# the 2026-11-01 snapshot. Bumping the toolchain means bumping this line in the
# same commit, and `scripts/verus-check.sh` proves the pair still agrees.
vstd = "=0.0.0-2026-11-01-0251"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
