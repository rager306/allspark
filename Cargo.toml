[workspace]
resolver = "2"
members = [
    "crates/pa-telemetry",
    "crates/pa-types",
    "crates/pa-ai",
    "crates/pa-models",
    "crates/pa-agent",
    "crates/pa-lsp",
    "crates/pa-diff",
    "crates/pa-jev",
    "crates/pa-ast",
    "crates/pa-edit",
    "crates/pa-graph",
    "crates/pa-mem",
    "crates/pa-core",
    "crates/pa-daemon",
    "crates/pa-tui",
    "crates/pa-cli",
    "crates/pa-perf",
]

# Crossterm 0.28.1's kitty support check holds the process-wide event reader
# for 2s on terminals that do not answer. Keep its parser/queued input intact,
# but cap the query poll to 250ms (late real-terminal replies still get a chance).
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
# tree-sitter-go 0.25.0 (latest release) rejects Go 1.26 `new(expr)`; the
# vendored copy carries the upstream grammar fix (see its README.md). Remove
# this entry once a crates.io release parses `new(expr)`.
tree-sitter-go = { path = "vendor/tree-sitter-go" }

[workspace.package]
version = "0.10.1-beta.38"
edition = "2021"
license = "MIT"
authors = ["Stencil Labs, Inc."]
homepage = "https://omp.sh/"
repository = "https://github.com/can1357/oh-my-pi"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: serde_json::Map keeps insertion order (IndexMap) so every
# wire/durable JSON surface serializes in construction order — the JS object
# model the TS daemon and session files byte-emit. Without it the Map is a
# BTreeMap and every Value-built frame re-sorts its keys alphabetically,
# diverging from the TS byte stream (e.g. compaction `details` order).
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pa-telemetry = { path = "crates/pa-telemetry" }
pa-types = { path = "crates/pa-types" }
pa-ai = { path = "crates/pa-ai" }
pa-agent = { path = "crates/pa-agent" }
thiserror = "2"
futures = "0.3"
toml = "0.9"
# Dev-only; the default fork/timeout features are unused.
proptest = { version = "1.11", default-features = false, features = ["std"] }

# ── pa-ast / pa-diff (fork port of oh-my-pi's pi-ast / pi-diff) ──────────
# Versions mirror the upstream oh-my-pi workspace that these crates came from
# (its Cargo.lock), so the vendored sources compile unchanged.
pa-ast = { path = "crates/pa-ast" }
pa-diff = { path = "crates/pa-diff" }
# pa-edit: edit engine (fork port of oh-my-pi's pi-edit); depends on
# pa-ast/pa-diff but NOT on the unsafe pi-walker/pi-vfs crates.
pa-edit = { path = "crates/pa-edit" }
# pa-graph: on-disk SQLite code graph + FTS5 symbol search (leaf crate).
pa-graph = { path = "crates/pa-graph" }
# pa-mem: low-level RAM layout structures ported (safely) from pogocache
# (sharded maps, Robin Hood hashing, 48-bit packed pointers, entry arenas,
# spinlock/refcount, block-LZ4 snapshots). Leaf crate, no graph coupling.
pa-mem = { path = "crates/pa-mem" }
# pa-lsp: native Rust language-server tool (stdio LSP clients + tree-sitter
# symbol layer); leaf crate over pa-agent/pa-ast/async-lsp.
pa-lsp = { path = "crates/pa-lsp" }
# pa-jev: the typed-judgment (System One) wire layer + client (fork-only
# leaf crate; the chain, cache, and tool live in pa-core::jev).
pa-jev = { path = "crates/pa-jev" }
# AST & tree-sitter: `ast-grep-core` without its default grammar features —
# pa-ast links the grammars itself and loads the rest as wasm.
ast-grep-core = { version = "0.45", default-features = false, features = [
    "tree-sitter",
] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-diff = "0.1"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-regex = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
# Test-only stand-ins for wasm grammars (pa-ast dev-dependencies).
tree-sitter-elisp = "1.7.2"
tree-sitter-fortran = "0.6.0"
tree-sitter-ruby = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-lua = "0.5"
phf = { version = "0.14", features = ["macros"] }
globset = "0.4"
ignore = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }
# NOTE: upstream pi-edit used `xutf`, which unconditionally requires the
# nightly `portable_simd` feature and cannot compile on this workspace's
# pinned stable toolchain. pa-edit uses `unicode-normalization` (already a
# pa-core dependency) for its single NFC call instead.
unicode-normalization = "0.1"
# pa-edit runtime deps: async-trait for the host EditWriter trait, parking_lot
# for the EditStore mutex (std Mutex would work too but the port uses this).
async-trait = "0.1"
parking_lot = "0.12"

# ── pa-graph (on-disk SQLite code graph) ────────────────────────────────
# bundled = vendored SQLite (FTS5 enabled, no system libsqlite3, no unsafe
# Rust in our crate); the FTS5 build flag is what the symbol index rides on.
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1.8"
sha2 = "0.10"
# pa-mem (F9): block-LZ4 snapshot compression. Pure-Rust, safe-only
# encode/decode; `frame` (and its twox-hash dep) is off — the snapshot
# format is the raw LZ4 block format plus pogocache's 16-byte header.
lz4_flex = { version = "0.13", default-features = false, features = [
    "std",
    "safe-encode",
    "safe-decode",
] }
# pa-mem (F9): per-block CRC32 for the snapshot header (same polynomial
# pogocache uses in util.c).
crc32fast = "1.5"
rayon = "1.12"
regex = "1"
unicode-segmentation = "1"
# petgraph: SCC/condensation/connected-components for the architecture view
# (G6 layers/cycles/clusters). Default features only; `graphmap`/`stable_graph`
# are unused but are part of petgraph's default set.
petgraph = "0.8.3"
# notify: native filesystem-event backend for pa-graph's S16 watcher (the
# mtime-polling backend needs no dependency; this one uses the OS notifier).
notify = "8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The pedantic gate the five clippy campaigns earned (pa-daemon #3029,
# pa-cli #3050, pa-core #3093, the small crates #3110, pa-tui #3134):
# every workspace member is pedantic-clean; CI's -D warnings bar turns
# this warn class into errors, and the per-crate #![allow] exceptions
# (the design-choice classes, each with its in-code justification) keep
# their force under the manifest route.
pedantic = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
bool_to_int_with_if = "warn"
case_sensitive_file_extension_comparisons = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
elidable_lifetime_names = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_bool = "warn"
match_wildcard_for_single_variants = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
range_plus_one = "warn"
redundant_else = "warn"
return_self_not_must_use = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
unicode_not_nfc = "warn"
unchecked_time_subtraction = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_semicolon = "warn"
used_underscore_binding = "warn"

# Shipping posture, pinned (Kevin, Option C): thin LTO plus 4 codegen
# units for cross-crate inlining in the hot render path. Builds emit line
# tables and do NOT strip at link: the release pipeline's split_debug step
# produces the SHIPPED binary (objcopy --strip-debug — DWARF gone, function
# names stay) and the split-debug decoder sidecar (objcopy
# --only-keep-debug, gzipped) from the SAME linked image, so the decoder's
# addresses match the shipped binary exactly. A second unstripped build
# would NOT match: link-stage layout differs when stripping runs at link
# (measured: .text sha256 differs between the link-strip and no-strip
# builds of the same source). TRADEOFF, stated explicitly: the shipped
# binary's panic backtraces keep function names but lose file:line; the
# decoder restores file:line offline and ships as a SEPARATE release
# asset, never install payload (assemble_artifacts.py hard-fails on
# decoder sidecars). .dynsym survives stripping, so dynamic linking and
# the release GLIBC baseline gate are unaffected. macOS is unchanged:
# darwin builds keep line tables in the executable (dSYM extraction is a
# documented follow-up); byte claims are measured on Linux x86_64 ELF
# only.
[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

# Fork-local compact profile: same codegen posture as release, plus
# symbol stripping and no debug info. Build with:
#   cargo build --profile dist -p pa-cli
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"
# panic = "unwind" (release default) on purpose: a panicking protocol-reader
# task in a session worker must unwind and settle, not abort the whole
# worker process mid-turn.
lto = "fat"
codegen-units = 1
