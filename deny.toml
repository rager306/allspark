# cargo-deny configuration for the prime-agent Rust workspace.
# Runs in CI (ci.yml) and locally via `make deny`.

[graph]
all-features = true

[advisories]
version = 2
# Fail the build on any reachable vulnerability or withdrawn advisory.
yanked = "deny"
# Triaged exceptions — every entry must carry a reason and a review date;
# a landed fix upstream means the entry is removed instead of silenced.
ignore = [
  # Marvin Attack timing sidechannel in rsa; no patch exists upstream
  # (RustCrypto/RSA#626 tracks it). `rsa` is currently a dead dependency in
  # pa-ai (declared, never referenced); no signing path executes it, so no
  # timing oracle exists. Reviewed 2026-09-17; drop rsa (pa-ai lane) or
  # re-triage when rsa publishes a fix.
  { id = "RUSTSEC-2023-0071", reason = "unpatched upstream; rsa is an unused pa-ai dep, no signing path executes it (reviewed 2026-09-17)" },
  # `paste` proc-macro is unmaintained; pulled by ratatui (build-time only,
  # no vulnerable code path). Reviewed 2026-09-17; revisit when ratatui
  # drops the dep.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via ratatui, build-time only (reviewed 2026-09-17)" },
  # Advisory batch 2026-10-18: rustls TLS issues (tungstenite
  # transitive), wasmtime sandbox issues (ast-grep transitive), ring
  # timing sidechannel — pre-existing; patches pending upstream.
  # Review: 2026-11-18
  { id = "RUSTSEC-2025-0046", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2025-0118", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0006", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0020", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0021", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0085", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0086", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0087", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0088", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0089", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0091", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0092", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0093", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0094", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0095", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0096", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0222", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
  { id = "RUSTSEC-2026-0269", reason = "pre-existing transitive; patch pending upstream (reviewed 2026-10-18)" },
