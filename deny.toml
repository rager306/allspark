[licenses]
version = 2
# Deny-by-default; the allowlist below is the exact set carried by the
# dependency graph (verified with `cargo deny check licenses`).
# The exact set carried by the dependency graph (verified with
# `cargo deny check licenses`); unmatched entries are removed on bump.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # notify (the `@` file index watcher) — CC0 public domain dedication.
  "CC0-1.0",
  # Advisory batch (2026-10-18 CI): rustls TLS issues (tungstenite
  # transitive), wasmtime sandbox issues (ast-grep transitive), and
  # one ring timing sidechannel — all pre-existing; patches pending
  # upstream adoption. Review: 2026-11-18
  "RUSTSEC-2025-0046",
  "RUSTSEC-2025-0118",
  "RUSTSEC-2026-0006",
  "RUSTSEC-2026-0020",
  "RUSTSEC-2026-0021",
  "RUSTSEC-2026-0085",
  "RUSTSEC-2026-0086",
  "RUSTSEC-2026-0087",
  "RUSTSEC-2026-0088",
  "RUSTSEC-2026-0089",
  "RUSTSEC-2026-0091",
  "RUSTSEC-2026-0092",
  "RUSTSEC-2026-0093",
  "RUSTSEC-2026-0094",
  "RUSTSEC-2026-0095",
  "RUSTSEC-2026-0096",
  "RUSTSEC-2026-0222",
  "RUSTSEC-2026-0269",
  "RUSTSEC-2026-0316",
  "RUSTSEC-2026-0346",
  "RUSTSEC-2026-0347",
  "RUSTSEC-2026-0348",
  "RUSTSEC-2026-0349",
  "RUSTSEC-2026-0363",
